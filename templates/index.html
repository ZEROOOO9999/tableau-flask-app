<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Global AI Adoption</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            color: #1e293b;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            background: white;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 70%;
            max-width: 800px;
        }

        .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 44px;
            margin: 10px 0;
        }

        h2 {
            font-size: 22px;
            font-weight: normal;
            color: #475569;
            margin-bottom: 20px;
        }

        p {
            font-size: 17px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: 15px 28px;
            text-decoration: none;
            color: white;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .dashboard {
            background: #2563eb;
        }

        .story {
            background: #7c3aed;
        }

        .button:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        .footer {
            margin-top: 35px;
            font-size: 14px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="hero">

        <div class="container">

            <div class="icon">🤖</div>

            <h1>Global AI Adoption</h1>

            <h2>AI Adoption Analysis & Visualization</h2>

            <p>
                Explore global artificial intelligence adoption through
                interactive data visualizations, insights, and an analytical story.
            </p>

            <div class="buttons">

                <a href="/dashboard" class="button dashboard">
                    📊 View Dashboard
                </a>

                <a href="/story" class="button story">
                    📖 View Story
                </a>

            </div>

            <div class="footer">
                Powered by Flask & Tableau Public
            </div>

        </div>

    </div>

</body>

</html>
